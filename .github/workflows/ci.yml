name: CI

# Thin caller — the pipeline lives once in jon-platform's reusable workflow so every
# app shares one source of truth (jon-platform docs/ios/drift-control.md § CI).
# Depends on two one-time account settings documented there: cross-repo Actions
# access on jon-platform, and this repo's JON_PLATFORM_PAT secret (passed via
# `secrets: inherit`).
#
# YesChefPackage consumes jon-platform packages by local path
# (../../../jon-platform/packages/{LLMClientKit,CloudSyncKit,LLMHandoffKit}); the
# reusable workflow's checkout step provides them. The manifest tracks Swift 6.4
# (Xcode 27 beta), so the capability gate skips the test job green on today's hosted
# images and auto-runs it once they ship a matching toolchain.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    uses: jonphillips/jon-platform/.github/workflows/ios-ci.yml@main
    with:
      package-path: YesChefPackage
      # test-runner left at the default (macos-latest) until hosted runners ship Xcode 27
    secrets: inherit
