name: CI

# Thin caller — the pipeline lives once in the public ci-workflows repo so every app
# shares one source of truth. (It's public because yes-chef is public and GitHub won't
# let a public repo call a reusable workflow in the private jon-platform repo.) Depends
# only on this repo's JON_PLATFORM_PAT secret, passed through via `secrets: inherit`.
#
# YesChefPackage consumes jon-platform packages by local path
# (../../../jon-platform/packages/{LLMClientKit,CloudSyncKit,LLMHandoffKit}); the
# reusable workflow's checkout step provides them. The manifest tracks Swift 6.4
# (Xcode 27 beta), so the capability gate skips the test job green on today's hosted
# images and auto-runs it once they ship a matching toolchain.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    uses: jonphillips/ci-workflows/.github/workflows/ios-ci.yml@main
    with:
      package-path: YesChefPackage
      # test-runner left at the default (macos-latest) until hosted runners ship Xcode 27
    secrets: inherit
