name: YesChef
options:
  bundleIdPrefix: com.jonphillips
  deploymentTarget:
    iOS: "27.0"
packages:
  YesChefPackage:
    path: YesChefPackage
  WebExtractorKit:
    path: ../../jon-platform/packages/WebExtractorKit
  LLMClientKit:
    path: ../../jon-platform/packages/LLMClientKit
  CloudSyncKit:
    path: ../../jon-platform/packages/CloudSyncKit
  Dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: 1.0.0
  # SQLiteData and GRDB are declared here so the app and the share extension can
  # LINK them, not merely compile against them. Both reach the type checker for
  # free (`import YesChefCore` re-exports SQLiteData, which `@_exported`-re-exports
  # GRDB's `Database`/`DatabaseWriter`), and both are absent from the linker's
  # search path once these package products build as dynamic frameworks — which
  # they do for every target in the graph as soon as a test bundle is in the
  # build. The plain `build` linked statically and never noticed. Same defect,
  # same fix, as the GRDB entries in YesChefPackage/Package.swift and
  # jon-platform/packages/CloudSyncKit/Package.swift.
  SQLiteData:
    url: https://github.com/pointfreeco/sqlite-data
    from: 1.8.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.6.0
  # StructuredQueriesCore is the third instance of the same defect, missed when
  # SQLiteData and GRDB were added above. The `@Table` macro expands to
  # `QueryExpression` / `QueryBindable` conformances on `Foundation.Data`, `Date`
  # and `UUID` that live in StructuredQueriesCore, and app sources reference them
  # directly — `GroceryModels.o` and `HandoffEntities.o` fail to link without it.
  StructuredQueries:
    url: https://github.com/pointfreeco/swift-structured-queries
    from: 0.31.0
  # CustomDump is the same class of defect one layer out: YesChefAppTests calls
  # `expectNoDifference`, which the type checker sees because SQLiteData and
  # StructuredQueriesCore re-export CustomDump, and which the linker cannot find
  # because neither product LINKS it into a consumer. YesChefPackage's own test
  # target has carried this dependency all along; the app test bundle needed it
  # too the moment a test there reached for the API.
  CustomDump:
    url: https://github.com/pointfreeco/swift-custom-dump
    from: 1.0.0
  CasePaths:
    url: https://github.com/pointfreeco/swift-case-paths
    from: 1.0.0
  SwiftNavigation:
    url: https://github.com/pointfreeco/swift-navigation
    from: 2.0.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  YesChef:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: YesChefApp
    info:
      path: YesChefApp/Info.plist
      properties:
        CFBundleDisplayName: Yes Chef
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - remote-notification
        # ADR-0030's backup file type. This MUST live here, not hand-added to
        # YesChefApp/Info.plist: that file is generated from this block, so a
        # hand edit survives only until the next `xcodegen generate` — which the
        # Verification Pattern requires after adding any Swift source. It was
        # hand-added once and silently deleted on the next regenerate; without it
        # `.yesChefSQLiteBackup` has no declared UTI and export/restore breaks.
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Yes Chef Backup
            UTTypeIdentifier: com.jonphillips.yeschef.database-backup
            UTTypeTagSpecification:
              public.filename-extension:
                - sqlite
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Yes Chef Menu Recipe
            UTTypeIdentifier: com.jon.yeschef.menu-recipe
        UILaunchScreen: {}
    dependencies:
      - package: YesChefPackage
        product: YesChefCore
      - package: WebExtractorKit
        product: WebExtractorKit
      - package: LLMClientKit
        product: LLMClientKit
      - package: CloudSyncKit
        product: CloudSyncKit
      - package: Dependencies
        product: Dependencies
      - package: SQLiteData
        product: SQLiteData
      - package: GRDB
        product: GRDB
      - package: StructuredQueries
        product: StructuredQueriesCore
      - package: CasePaths
        product: CasePaths
      - package: SwiftNavigation
        product: SwiftUINavigation
      - package: ZIPFoundation
        product: ZIPFoundation
      - target: YesChefShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonphillips.yeschef
        PRODUCT_NAME: YesChef
        CODE_SIGN_ENTITLEMENTS: YesChefApp/YesChef.entitlements
        DEVELOPMENT_TEAM: 7MQEE539G9
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  YesChefShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: YesChefShareExtension
    dependencies:
      - package: YesChefPackage
        product: YesChefCore
      - package: Dependencies
        product: Dependencies
      - package: SQLiteData
        product: SQLiteData
      - package: GRDB
        product: GRDB
      - package: StructuredQueries
        product: StructuredQueriesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonphillips.yeschef.share-extension
        PRODUCT_NAME: YesChefShareExtension
        CODE_SIGN_ENTITLEMENTS: YesChefShareExtension/YesChefShareExtension.entitlements
        DEVELOPMENT_TEAM: 7MQEE539G9
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: YesChefShareExtension/Info.plist
        MARKETING_VERSION: "1.0"
        APPLICATION_EXTENSION_API_ONLY: YES
  YesChefTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: YesChefAppTests
    dependencies:
      - target: YesChef
      - package: YesChefPackage
        product: YesChefCore
      - package: LLMClientKit
        product: LLMClientKit
      # NOT DependenciesTestSupport. Xcode builds every other package product in
      # this graph as a dynamic framework, but DependenciesTestSupport only ever
      # builds static ("DependenciesTestSupport-product", never
      # "…dynamic-product"), so linking it drags a second static copy of the
      # whole Dependencies target into the test bundle — 401 duplicate symbols,
      # including a second `DependencyValues.$_current` TaskLocal.
      #
      # Task-local identity is the address of the TaskLocal object, so with two
      # copies loaded, `withDependencies { }` set from the test bundle is
      # INVISIBLE to app-module code reading the framework's copy. Overrides
      # silently did nothing and the live dependency ran instead: 11 of the 26
      # tests failed for that reason alone. Nothing here uses its API — the
      # `.test` context is detected by Dependencies at runtime without it.
      - package: Dependencies
        product: Dependencies
      - package: SQLiteData
        product: SQLiteData
      - package: GRDB
        product: GRDB
      - package: StructuredQueries
        product: StructuredQueriesCore
      - package: CustomDump
        product: CustomDump
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonphillips.yeschef.tests
        DEVELOPMENT_TEAM: 7MQEE539G9
        GENERATE_INFOPLIST_FILE: YES
schemes:
  YesChef:
    build:
      targets:
        YesChef: all
        YesChefShareExtension: all
    test:
      config: Debug
      targets:
        - name: YesChefTests
    run:
      config: Debug
