included:
  - YesChefApp
  - YesChefPackage/Sources
  - YesChefPackage/Tests

excluded:
  - YesChefPackage/Sources/YesChefCore/SampleData.swift
  - YesChefPackage/Sources/YesChefCore/Schema.swift

only_rules:
  - custom_rules
  - file_length
  - function_body_length
  - type_body_length

file_length:
  warning: 1000
  error: 1150
  ignore_comment_only_lines: true

type_body_length:
  warning: 560
  error: 650

function_body_length:
  warning: 170
  error: 220

custom_rules:
  # Keep this vocabulary in sync with ADR-0065 D2.
  concept_glyph_literal:
    name: Concept glyph literal
    excluded: YesChefApp/AppSymbol.swift
    regex: '(?:\b(?:systemImage|systemName|image):\s*"(?:custom\.[^"]+|richtext\.page|menucard|book|books\.vertical|folder|folder\.badge\.plus|tag|fork\.knife|square\.and\.pencil|pencil|trash|calendar|calendar\.badge\.plus|cart|cart\.badge\.plus|square\.and\.arrow\.up|hammer|target|questionmark\.circle)"|\bImage\(\s*"(?:custom\.[^"]+|richtext\.page|menucard|book|books\.vertical|folder|folder\.badge\.plus|tag|fork\.knife|square\.and\.pencil|pencil|trash|calendar|calendar\.badge\.plus|cart|cart\.badge\.plus|square\.and\.arrow\.up|hammer|target|questionmark\.circle)"|\bcase\s+[^\n:]+:\s*"(?:custom\.[^"]+|richtext\.page|menucard|book|books\.vertical|folder|folder\.badge\.plus|tag|fork\.knife|square\.and\.pencil|pencil|trash|calendar|calendar\.badge\.plus|cart|cart\.badge\.plus|square\.and\.arrow\.up|hammer|target|questionmark\.circle)"|\?\s*"(?:custom\.[^"]+|richtext\.page|menucard|book|books\.vertical|folder|folder\.badge\.plus|tag|fork\.knife|square\.and\.pencil|pencil|trash|calendar|calendar\.badge\.plus|cart|cart\.badge\.plus|square\.and\.arrow\.up|hammer|target|questionmark\.circle)"|\?\s*"[^"\n]*"\s*:\s*"(?:custom\.[^"]+|richtext\.page|menucard|book|books\.vertical|folder|folder\.badge\.plus|tag|fork\.knife|square\.and\.pencil|pencil|trash|calendar|calendar\.badge\.plus|cart|cart\.badge\.plus|square\.and\.arrow\.up|hammer|target|questionmark\.circle)")'
    message: Concept glyphs go through AppSymbol (ADR-0065).
    severity: error
  persistence_in_views:
    name: Persistence in SwiftUI views
    included: .*View\.swift
    regex: \bdatabase\.(write|read)\b
    message: Move database reads/writes into an observable model or core package boundary.
    severity: error
